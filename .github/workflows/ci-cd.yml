name: Full Microservices CI-CD Pipeline

on:
  push:
    branches:
      - devops

env:
  REGISTRY: docker.io
  IMAGE_TAG: latest

jobs:

  build-and-push:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - image: webapp
            project: src/WebApp/WebApp.csproj
            assembly: WebApp

          - image: catalog-api
            project: src/Catalog.API/Catalog.API.csproj
            assembly: Catalog.API

          - image: basket-api
            project: src/Basket.API/Basket.API.csproj
            assembly: Basket.API

          - image: ordering-api
            project: src/Ordering.API/Ordering.API.csproj
            assembly: Ordering.API

          - image: identity-api
            project: src/Identity.API/Identity.API.csproj
            assembly: Identity.API

          - image: webhooks-api
            project: src/Webhooks.API/Webhooks.API.csproj
            assembly: Webhooks.API

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          echo "Building ${{ matrix.image }}..."

          docker build \
            --build-arg PROJECT_PATH=${{ matrix.project }} \
            --build-arg ASSEMBLY_NAME=${{ matrix.assembly }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }} \
            -f docker/Dockerfile \
            .

      - name: Push Docker Image
        run: |
          echo "Pushing ${{ matrix.image }}..."

          docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

  deploy:

    name: Deploy Application to EC2

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy Containers
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "======================================="
            echo "Starting Deployment..."
            echo "======================================="

            cd ~/Depi-final/docker

            echo "Pulling latest Docker images..."
            docker-compose pull

            echo "Stopping old containers..."
            docker-compose down

            echo "Starting updated containers..."
            docker-compose up -d --force-recreate

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "======================================="
            echo "Deployment Completed Successfully"
            echo "======================================="

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "======================================="
            echo "Running Containers"
            echo "======================================="

            docker ps

            echo "======================================="
            echo "Checking WebApp Health"
            echo "======================================="

            curl -I http://localhost:5100 || true

            echo "======================================="
            echo "Deployment Verification Finished"
            echo "======================================="