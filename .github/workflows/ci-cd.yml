name: Full Microservices CI-CD

on:
  push:
    branches:
      - devops

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:

          - image: webapp
            project: src/WebApp/WebApp.csproj
            assembly: WebApp

          - image: catalog-api
            project: src/Catalog.API/Catalog.API.csproj
            assembly: Catalog.API

          - image: basket-api
            project: src/Basket.API/Basket.API.csproj
            assembly: Basket.API

          - image: ordering-api
            project: src/Ordering.API/Ordering.API.csproj
            assembly: Ordering.API

          - image: identity-api
            project: src/Identity.API/Identity.API.csproj
            assembly: Identity.API

          - image: webhooks-api
            project: src/Webhooks.API/Webhooks.API.csproj
            assembly: Webhooks.API

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg PROJECT_PATH=${{ matrix.project }} \
            --build-arg ASSEMBLY_NAME=${{ matrix.assembly }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest \
            -f docker/Dockerfile \
            .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest

  deploy:
    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/Depi-final/docker

            docker-compose pull

            docker-compose down

            docker-compose up -d

            docker image prune -f