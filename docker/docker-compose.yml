# eShop — Docker Compose using DockerHub images

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  ENABLE_HEALTH_CHECKS: "true"
  DisableHttpsRedirection: "true"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

x-eventbus-env: &eventbus-env
  ConnectionStrings__eventbus: amqp://guest:guest@rabbitmq:5672
  ConnectionStrings__EventBus: amqp://guest:guest@rabbitmq:5672

x-identity-jwt-env: &identity-jwt-env
  Identity__Url: ${PUBLIC_IDENTITY_URL}
  Identity__MetadataAddress: ${PUBLIC_IDENTITY_URL}/.well-known/openid-configuration

x-oidc-client-env: &oidc-client-env
  IdentityUrl: ${PUBLIC_IDENTITY_URL}
  IdentityMetadataAddress: ${PUBLIC_IDENTITY_URL}/.well-known/openid-configuration

x-dotnet-healthcheck: &dotnet-healthcheck
  test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 120s

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eshop-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - eshop-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - eshop-network

  identity-api:
    image: abdosaad0/identity-api:latest

    env_file:
      - .env

    ports:
      - "8081:8080"

    environment:
      <<: *dotnet-env

      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}
      PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL}
      PUBLIC_WEBHOOKS_CLIENT_URL: ${PUBLIC_WEBHOOKS_CLIENT_URL}

      IssuerUri: ${PUBLIC_IDENTITY_URL}

      ConnectionStrings__identitydb: Host=postgres;Port=5432;Database=identitydb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

      WebAppClient: ${PUBLIC_WEBAPP_URL}
      WebhooksWebClient: ${PUBLIC_WEBHOOKS_CLIENT_URL}

      BasketApiClient: http://localhost:8082
      OrderingApiClient: http://localhost:8084
      WebhooksApiClient: http://localhost:8085

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

  basket-api:
    image: abdosaad0/basket-api:latest

    env_file:
      - .env

    ports:
      - "8082:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env, *identity-jwt-env]

      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}

      ConnectionStrings__redis: redis:6379
      Identity__Audience: basket
      Kestrel__EndpointDefaults__Protocols: Http1AndHttp2

    depends_on:
      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      identity-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

  catalog-api:
    image: abdosaad0/catalog-api:latest

    ports:
      - "8083:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env]

      ConnectionStrings__catalogdb: Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

  ordering-api:
    image: abdosaad0/ordering-api:latest

    env_file:
      - .env

    ports:
      - "8084:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env, *identity-jwt-env]

      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}

      ConnectionStrings__orderingdb: Host=postgres;Port=5432;Database=orderingdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

      Identity__Audience: orders

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      identity-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

  webhooks-api:
    image: abdosaad0/webhooks-api:latest

    env_file:
      - .env

    ports:
      - "8085:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env, *identity-jwt-env]

      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}

      ConnectionStrings__webhooksdb: Host=postgres;Port=5432;Database=webhooksdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

      Identity__Audience: webhooks

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      identity-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

  order-processor:
    image: abdosaad0/order-processor:latest

    environment:
      <<: [*dotnet-env, *eventbus-env]

      ConnectionStrings__orderingdb: Host=postgres;Port=5432;Database=orderingdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      ordering-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

  payment-processor:
    image: abdosaad0/payment-processor:latest

    environment:
      <<: [*dotnet-env, *eventbus-env]

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

  webapp:
    image: abdosaad0/webapp:latest

    env_file:
      - .env

    ports:
      - "5100:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env, *oidc-client-env]

      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}
      PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL}
      PUBLIC_WEBHOOKS_CLIENT_URL: ${PUBLIC_WEBHOOKS_CLIENT_URL}

      CallBackUrl: ${PUBLIC_WEBAPP_URL}/signin-oidc

      ServiceUrls__basket-api: http://basket-api:8080
      ServiceUrls__catalog-api: http://catalog-api:8080
      ServiceUrls__ordering-api: http://ordering-api:8080
      ServiceUrls__catalog-api-forwarder: http://catalog-api:8080

      Services__catalog-api__http__0: http://catalog-api:8080
      Services__ordering-api__http__0: http://ordering-api:8080
      Services__basket-api__http__0: http://basket-api:8080

    depends_on:
      identity-api:
        condition: service_healthy

      basket-api:
        condition: service_healthy

      catalog-api:
        condition: service_healthy

      ordering-api:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

  webhooksclient:
    image: abdosaad0/webhooksclient:latest

    env_file:
      - .env

    ports:
      - "5102:8080"

    environment:
      <<: [*dotnet-env, *oidc-client-env]

      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}
      PUBLIC_WEBHOOKS_CLIENT_URL: ${PUBLIC_WEBHOOKS_CLIENT_URL}

      CallBackUrl: ${PUBLIC_WEBHOOKS_CLIENT_URL}/signin-oidc

    depends_on:
      identity-api:
        condition: service_healthy

      webhooks-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

volumes:
  postgres-data:

networks:
  eshop-network:
    driver: bridge