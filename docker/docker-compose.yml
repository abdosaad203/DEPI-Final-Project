# eShop — Production-like Docker Compose

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  ENABLE_HEALTH_CHECKS: "true"
  DisableHttpsRedirection: "true"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

x-eventbus-env: &eventbus-env
  ConnectionStrings__eventbus: amqp://guest:guest@rabbitmq:5672
  ConnectionStrings__EventBus: amqp://guest:guest@rabbitmq:5672

x-identity-jwt-env: &identity-jwt-env
  Identity__Url: ${PUBLIC_IDENTITY_URL}
  Identity__MetadataAddress: ${PUBLIC_IDENTITY_URL}/.well-known/openid-configuration

x-oidc-client-env: &oidc-client-env
  IdentityUrl: ${PUBLIC_IDENTITY_URL}
  IdentityMetadataAddress: ${PUBLIC_IDENTITY_URL}/.well-known/openid-configuration

x-dotnet-healthcheck: &dotnet-healthcheck
  test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 120s

x-logging: &default-logging
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - eshop-network

    <<: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - eshop-network

    <<: *default-logging

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - eshop-network

    <<: *default-logging

  identity-api:
    image: abdosaad0/identity-api:${IMAGE_TAG:-latest}
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8081:8080"

    environment:
      <<: *dotnet-env

      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}
      PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL}
      PUBLIC_WEBHOOKS_CLIENT_URL: ${PUBLIC_WEBHOOKS_CLIENT_URL}

      IssuerUri: ${PUBLIC_IDENTITY_URL}

      ConnectionStrings__identitydb: Host=postgres;Port=5432;Database=identitydb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

      WebAppClient: ${PUBLIC_WEBAPP_URL}
      WebhooksWebClient: ${PUBLIC_WEBHOOKS_CLIENT_URL}

      BasketApiClient: http://basket-api:8080
      OrderingApiClient: http://ordering-api:8080
      WebhooksApiClient: http://webhooks-api:8080

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

    <<: *default-logging

  basket-api:
    image: abdosaad0/basket-api:${IMAGE_TAG:-latest}
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8082:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env, *identity-jwt-env]

      ConnectionStrings__redis: redis:6379

      Identity__Audience: basket

    depends_on:
      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      identity-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

    <<: *default-logging

  catalog-api:
    image: abdosaad0/catalog-api:${IMAGE_TAG:-latest}
    restart: unless-stopped

    ports:
      - "8083:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env]

      ConnectionStrings__catalogdb: Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

    <<: *default-logging

  ordering-api:
    image: abdosaad0/ordering-api:${IMAGE_TAG:-latest}
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8084:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env, *identity-jwt-env]

      ConnectionStrings__orderingdb: Host=postgres;Port=5432;Database=orderingdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

      Identity__Audience: orders

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      identity-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

    <<: *default-logging

  webhooks-api:
    image: abdosaad0/webhooks-api:${IMAGE_TAG:-latest}
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8085:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env, *identity-jwt-env]

      ConnectionStrings__webhooksdb: Host=postgres;Port=5432;Database=webhooksdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

      Identity__Audience: webhooks

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      identity-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

    <<: *default-logging

  order-processor:
    image: abdosaad0/order-processor:${IMAGE_TAG:-latest}
    restart: unless-stopped

    environment:
      <<: [*dotnet-env, *eventbus-env]

      ConnectionStrings__orderingdb: Host=postgres;Port=5432;Database=orderingdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

    <<: *default-logging

  payment-processor:
    image: abdosaad0/payment-processor:${IMAGE_TAG:-latest}
    restart: unless-stopped

    environment:
      <<: [*dotnet-env, *eventbus-env]

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

    <<: *default-logging

  webapp:
    image: abdosaad0/webapp:${IMAGE_TAG:-latest}
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5100:8080"

    environment:
      <<: [*dotnet-env, *eventbus-env, *oidc-client-env]

      PUBLIC_IDENTITY_URL: ${PUBLIC_IDENTITY_URL}
      PUBLIC_WEBAPP_URL: ${PUBLIC_WEBAPP_URL}
      PUBLIC_WEBHOOKS_CLIENT_URL: ${PUBLIC_WEBHOOKS_CLIENT_URL}

      Authentication__RequireHttpsMetadata: "false"

      CallBackUrl: ${PUBLIC_WEBAPP_URL}/signin-oidc

      ServiceUrls__basket-api: http://basket-api:8080
      ServiceUrls__catalog-api: http://catalog-api:8080
      ServiceUrls__ordering-api: http://ordering-api:8080

    depends_on:
      identity-api:
        condition: service_healthy

      basket-api:
        condition: service_healthy

      catalog-api:
        condition: service_healthy

      ordering-api:
        condition: service_healthy

    healthcheck: *dotnet-healthcheck

    networks:
      - eshop-network

    <<: *default-logging

volumes:
  postgres-data:

networks:
  eshop-network:
    driver: bridge