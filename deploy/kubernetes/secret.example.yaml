# Copy to secret.yaml, fill values, and apply. Do not commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: eshop-secrets
  namespace: eshop
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  catalogdb: "Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=postgres"
  identitydb: "Host=postgres;Port=5432;Database=identitydb;Username=postgres;Password=postgres"
  orderingdb: "Host=postgres;Port=5432;Database=orderingdb;Username=postgres;Password=postgres"
  webhooksdb: "Host=postgres;Port=5432;Database=webhooksdb;Username=postgres;Password=postgres"
