apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eshop

resources:
  - namespace.yaml
  - configmap.yaml
  - infrastructure/postgres.yaml
  - infrastructure/redis.yaml
  - infrastructure/rabbitmq.yaml
  - apps/apis.yaml
  - apps/frontends.yaml
  - ingress.yaml

