    spec:
      containers:
        - name: webhooksclient
          image: abdosaad0/webhooksclient:latest

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"

          ports:
