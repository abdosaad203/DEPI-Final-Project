# Application workloads. Lightweight demo configuration for t3.small.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      containers:
        - name: identity-api
          image: abdosaad0/identity-api:latest

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: eshop-config

          env:
            - name: ConnectionStrings__identitydb
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: identitydb

            - name: IssuerUri
              valueFrom:
                configMapKeyRef:
                  name: eshop-config
                  key: PUBLIC_IDENTITY_URL

            - name: WebAppClient
              valueFrom:
                configMapKeyRef:
                  name: eshop-config
                  key: PUBLIC_WEBAPP_URL

            - name: WebhooksWebClient
              valueFrom:
                configMapKeyRef:
                  name: eshop-config
                  key: PUBLIC_WEBHOOKS_CLIENT_URL

            - name: BasketApiClient
              value: "http://basket-api:8080"

            - name: OrderingApiClient
              value: "http://ordering-api:8080"

            - name: WebhooksApiClient
              value: "http://webhooks-api:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: eshop
spec:
  selector:
    app: identity-api
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
    spec:
      containers:
        - name: basket-api
          image: abdosaad0/basket-api:latest

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: eshop-config

          env:
            - name: Identity__Url
              valueFrom:
                configMapKeyRef:
                  name: eshop-config
                  key: PUBLIC_IDENTITY_URL

            - name: Identity__Audience
              value: basket

            - name: Kestrel__EndpointDefaults__Protocols
              value: Http1AndHttp2

---
apiVersion: v1
kind: Service
metadata:
  name: basket-api
  namespace: eshop
spec:
  selector:
    app: basket-api
  ports:
    - port: 8080
      targetPort: 8080

