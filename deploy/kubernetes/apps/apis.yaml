# Application workloads. Set image registry via kustomization images or deploy/kubernetes/kustomization.yaml.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      containers:
        - name: identity-api
          image: abdosaad0/identity-api:latest

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: eshop-config

          env:
            - name: ConnectionStrings__identitydb
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: identitydb

            - name: IssuerUri
              valueFrom:
                configMapKeyRef:
                  name: eshop-config
                  key: PUBLIC_IDENTITY_URL

            - name: WebAppClient
              valueFrom:
                configMapKeyRef:
                  name: eshop-config
                  key: PUBLIC_WEBAPP_URL

            - name: WebhooksWebClient
              valueFrom:
                configMapKeyRef:
                  name: eshop-config
                  key: PUBLIC_WEBHOOKS_CLIENT_URL

            - name: BasketApiClient
              value: "http://basket-api:8080"

            - name: OrderingApiClient
              value: "http://ordering-api:8080"

            - name: WebhooksApiClient
              value: "http://webhooks-api:8080"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: eshop
spec:
  selector:
    app: identity-api
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
    spec:
      containers:
        - name: basket-api
          image: abdosaad0/basket-api:latest

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: eshop-config

          env:
            - name: Identity__Url
              valueFrom:
                configMapKeyRef:
                  name: eshop-config
                  key: PUBLIC_IDENTITY_URL

            - name: Identity__Audience
              value: basket

            - name: Kestrel__EndpointDefaults__Protocols
              value: Http1AndHttp2

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: basket-api
  namespace: eshop
spec:
  selector:
    app: basket-api
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: abdosaad0/catalog-api:latest

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: eshop-config

          env:
            - name: ConnectionStrings__catalogdb
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: catalogdb

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: eshop
spec:
  selector:
    app: catalog-api
  ports:
    - port: 8080
      targetPort: 8080